services:
  api:
    build:
      context: ./app
    image: maasai-mara-api:latest
    container_name: maasai-mara-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      - BUCKET_NAME=${BUCKET_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

    # ❌ REMOVED:
    # GOOGLE_APPLICATION_CREDENTIALS
    # volumes for gcp-key.json

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8080/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    image: maasai-mara-frontend:latest
    container_name: maasai-mara-frontend
    restart: unless-stopped

    ports:
      - "8501:8501"

    environment:
      - API_URL=http://api:8080

    depends_on:
      - api
